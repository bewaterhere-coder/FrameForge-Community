name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel jsonschema
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation -w dist .
      - name: Verify wheel license metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any('.dist-info/' in name and name.endswith('/LICENSE') for name in names), names
              metadata = next(archive.read(name).decode() for name in names if name.endswith('.dist-info/METADATA'))
              assert 'Classifier: License :: OSI Approved :: Apache Software License' in metadata, metadata
              assert 'License-File: LICENSE' in metadata, metadata
          PY
      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate
          schema = json.loads(Path('docs/plugin-manifest.schema.json').read_text())
          manifests = list(Path('src/frameforge/manifests').glob('*.json'))
          manifests += list(Path('examples/plugin-manifests').glob('*.json'))
          for path in manifests:
              validate(json.loads(path.read_text()), schema)
          PY

  mcp-stdio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install FrameForge with MCP extra
        run: python -m pip install --upgrade pip && python -m pip install -e '.[mcp]'
      - name: Verify local MCP stdio, evidence forwarding and path guard
        run: PYTHONPATH=src python scripts/verify_mcp_unity_evidence_e2e.py

  sample-project-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install FrameForge
        run: python -m pip install .
      - name: Verify the public sample project
        run: |
          python - <<'PY'
          from pathlib import Path
          from frameforge.core import inspect

          result = inspect(Path("examples/sample-game-godot"))
          assert any(item["plugin_id"] == "godot" for item in result["suggested_plugins"]), result
          assert result["selected_plugins"] == [{"id": "godot", "version": "0.1.0"}], result
          assert result["standards"]["architecture"] == "docs/architecture.md", result
          assert result["standards"]["asset-pipeline"] == "docs/asset-pipeline.md", result
          assert result["blocking"] is False, result
          assert not any(item["code"] == "PROFILE_INVALID" for item in result["warnings"]), result
          print("SAMPLE_PROJECT_ADVISORY_PASS plugin=godot profile=loaded standards=2 blocking=false")
          PY
